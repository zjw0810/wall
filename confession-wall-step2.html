<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六味情书 | 写下你的情话</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.8s ease;
}

/* ===== Deco layer (floating elements) ===== */
#deco {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.float {
  position: absolute;
  opacity: 0;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.8; }
  90%  { opacity: 0.8; }
  100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
}

/* ===== Top bar ===== */
.topbar {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 22px 0;
  max-width: 640px; margin: 0 auto;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.3);
  color: inherit;
  padding: 8px 16px;
  border-radius: 30px;
  font-size: 13px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: background 0.25s;
}
.back-btn:hover { background: rgba(255,255,255,0.3); }

.flavor-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.28);
  color: inherit;
  padding: 7px 15px;
  border-radius: 30px;
  font-size: 13px;
  backdrop-filter: blur(6px);
}
.flavor-chip .dot {
  width: 12px; height: 12px; border-radius: 50%;
  box-shadow: 0 0 8px currentColor;
}

/* ===== Step 2 header ===== */
.step-head {
  position: relative; z-index: 2;
  text-align: center;
  padding: 26px 20px 8px;
  max-width: 600px; margin: 0 auto;
}
.step-head .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,0.9); color: #333;
  font-size: 15px; font-weight: 700; margin-right: 8px;
  vertical-align: middle;
}
.step-head .txt {
  font-size: 20px; font-weight: 600; letter-spacing: 2px;
  vertical-align: middle; text-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.step-head .theme {
  font-size: 14px; margin-top: 10px; opacity: 0.92;
  font-style: italic; letter-spacing: 1px;
}
.step-head .inspire {
  font-size: 12.5px; margin-top: 14px; opacity: 0.7; line-height: 1.9;
  max-width: 460px; margin-left: auto; margin-right: auto;
}

/* ===== Input card ===== */
.write-card {
  position: relative; z-index: 2;
  max-width: 560px;
  margin: 22px auto 60px;
  padding: 28px 24px 30px;
  background: rgba(255,255,255,0.14);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 22px;
  backdrop-filter: blur(12px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
}
.confession-input {
  width: 100%; min-height: 150px;
  padding: 22px 20px;
  border: none; border-radius: 16px;
  background: rgba(255,255,255,0.9);
  font-size: 17px; line-height: 1.95;
  color: #3a2a2a;
  resize: vertical; outline: none;
  font-family: inherit;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.06);
}
.confession-input::placeholder { color: #b0a0a0; font-style: italic; }

.char-count { text-align: right; font-size: 12px; opacity: 0.75; margin: 8px 2px 0; }

.name-row {
  display: flex; align-items: center; gap: 10px; margin-top: 14px;
}
.name-row .at { font-size: 16px; opacity: 0.85; }
.name-input {
  flex: 1; padding: 12px 16px;
  border: none; border-radius: 12px;
  background: rgba(255,255,255,0.9);
  font-size: 14.5px; outline: none; color: #3a2a2a;
}
.name-input::placeholder { color: #bbb; }

.btn-generate {
  display: block; width: 100%; max-width: 320px;
  margin: 28px auto 0; padding: 17px 40px;
  background: rgba(255,255,255,0.95);
  color: #333;
  border: none; border-radius: 50px;
  font-size: 17px; font-weight: 700; letter-spacing: 3px;
  cursor: pointer; transition: all 0.3s;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}
.btn-generate:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,0.2); }
.btn-generate:active { transform: translateY(0); }

/* 月华白页面：输入框与按钮文字用灰色 */
body.flavor-yuebai .confession-input,
body.flavor-yuebai .name-input { color: #5A5550; }
body.flavor-yuebai .btn-generate { color: #5A5550; }

/* ===== Result overlay ===== */
.result-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: none;
  align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.4s ease;
}
.result-overlay.show { display: flex; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

.result-card {
  width: 100%; max-width: 480px; aspect-ratio: 3/4;
  border-radius: 22px; padding: 46px 34px 40px;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
@keyframes pop { from{transform:scale(0.82);opacity:0;} to{transform:scale(1);opacity:1;} }
.result-card .badge { position:absolute; top:16px; right:18px; width:34px; height:34px; border-radius:50%; border:1.5px solid currentColor; opacity:0.5; display:flex; align-items:center; justify-content:center; font-size:16px; }
.result-card .title { font-size: clamp(26px,6vw,40px); font-weight:700; margin-bottom:22px; letter-spacing:2px; line-height:1.4; }
.result-card .body { font-size: clamp(15px,3vw,18px); line-height:2.1; opacity:0.93; margin-bottom:26px; max-width:90%; }
.result-card .sig { font-size:14px; opacity:0.78; margin-top:auto; }
.close-btn {
  position: fixed; top: 24px; right: 24px;
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(0,0,0,0.35); color: #fff; border: none;
  font-size: 20px; cursor: pointer; z-index: 110;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.close-btn:hover { background: rgba(0,0,0,0.55); }
.action-bar { display:flex; gap:12px; margin-top:22px; justify-content:center; }
.action-btn {
  padding: 12px 26px; border-radius: 30px;
  border: 2px solid rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.15); color: #fff;
  font-size: 14px; cursor: pointer; transition: all 0.25s; backdrop-filter: blur(4px);
}
.action-btn:hover { background: rgba(255,255,255,0.3); }

/* LED fullscreen */
.led .result-card { max-width: 700px; width: 82%; }
.led .result-overlay { background: rgba(0,0,0,0.88); }
.led-hint { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); color:#fff; font-size:13px; opacity:0.55; z-index:111; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:0.4;} 50%{opacity:0.85;} }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
  background: rgba(40,20,20,0.9); color: #fff; padding: 12px 26px;
  border-radius: 30px; font-size: 14px; z-index: 200;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); white-space: normal; max-width: 86vw; text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width:580px){
  .write-card{ margin:18px 14px 50px; padding:22px 18px 24px; }
  .step-head{ padding:20px 16px 6px; }
}
</style>
</head>
<body>
<div id="deco"></div>

<div class="topbar">
  <button class="back-btn" onclick="back()">‹ 重新选味道</button>
  <span class="flavor-chip" id="chip"><span class="dot" id="chipDot"></span><span id="chipName">—</span></span>
</div>

<div class="step-head">
  <div><span class="num">2</span><span class="txt">写下你的情话</span></div>
  <div class="theme" id="themeLine">—</div>
  <div class="inspire" id="inspireLine"></div>
</div>

<section class="write-card">
  <textarea class="confession-input" id="confessionText" maxlength="120"
    placeholder="在这里写下你想对TA说的话…&#10;&#10;可以是三行诗、一句承诺，或只有简单的三个字。&#10;&#10;例：&#10;遇见你之前，我没想过结婚；&#10;遇见你之后，结婚这事我没想过别人。"
    oninput="updateCount()"></textarea>
  <div class="char-count"><span id="charCount">0</span> / 120 字</div>
  <div class="name-row">
    <span class="at">@</span>
    <input class="name-input" id="signName" placeholder="你的名字 / 昵称" maxlength="12">
  </div>
  <button class="btn-generate" onclick="generate()">生成我的表白卡 ✨</button>
</section>

<div class="result-overlay" id="overlay" onclick="closeR(e)">
  <button class="close-btn" onclick="closeR()">✕</button>
  <div class="result-card" id="card" onclick="event.stopPropagation()"></div>
  <div class="action-bar" id="actionBar" style="display:none">
    <button class="action-btn" onclick="ledMode()">🖥️ 投屏</button>
    <button class="action-btn" onclick="saveCard()">📥 保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== Flavor data ===== */
const FLAVORS = {
  zhizi: {
    name:'胭脂粉', en:'Rose Pink', slogan:'慢慢走进你的心',
    title:'硬壳之下皆温柔',
    quote:'初见时，只觉表皮青涩；拥你入怀，才知内心早已熟透成蜜。',
    color:'#8B4A52',
    bgDeep:'radial-gradient(circle at 30% 20%, #F4C2CC 0%, #E89AA8 45%, #C76B7A 100%)',
    bgCard:'linear-gradient(160deg,#F0B8C0 0%,#E898A8 100%)',
    deco:'petal'
  },
  yuebai: {
    name:'月华白', en:'Moon White', slogan:'质朴淳然的告白',
    title:'爱是人间烟火气',
    quote:'粥可温，立黄昏，米饭冒出的热气，就是凡尘里最踏实的我爱你。',
    color:'#5A5550',
    pageText:'#5A5550',
    bgDeep:'radial-gradient(circle at 70% 15%, #FBF8F4 0%, #E8E2DA 45%, #B8B0A6 100%)',
    bgCard:'linear-gradient(160deg,#F2EEE8 0%,#E5DFD8 100%)',
    deco:'moon'
  },
  qiuyang: {
    name:'秋阳金', en:'Autumn Gold', slogan:'啃一口甜甜的你',
    title:'你是我的黄金时代',
    quote:'每一粒都饱满发亮，像我把所有攒了一季的阳光，都倒进你眼里。',
    color:'#8B6932',
    bgDeep:'radial-gradient(circle at 50% 10%, #FCE3A8 0%, #E8BC78 45%, #B88840 100%)',
    bgCard:'linear-gradient(160deg,#F0D8A8 0%,#E8BC78 100%)',
    deco:'sun'
  },
  mushan: {
    name:'暮山紫', en:'Twilight Purple', slogan:'爆浆式地想你',
    title:'酸甜暗涌的回忆',
    quote:'表面或许平静，但只要轻轻一碰，就是一场瞬间侵占的浆果风暴。',
    color:'#5A4870',
    bgDeep:'radial-gradient(circle at 40% 25%, #E0D2EC 0%, #C8B8D8 45%, #8E78A8 100%)',
    bgCard:'linear-gradient(160deg,#DDD0E8 0%,#C8B8D8 100%)',
    deco:'berry'
  },
  shanlan: {
    name:'山岚绿', en:'Mist Green', slogan:'注定相逢的宿命',
    title:'如茶遇水地爱你',
    quote:'在你来之前，我是蜷缩的干叶；你来了，我释放出积攒了整个山野的香气。',
    color:'#3A6B54',
    bgDeep:'radial-gradient(circle at 35% 20%, #C6E0D0 0%, #98C4B0 45%, #5E8E74 100%)',
    bgCard:'linear-gradient(160deg,#B8D8C8 0%,#98C4B0 100%)',
    deco:'leaf'
  },
  hupo: {
    name:'琥珀褐', en:'Amber Brown', slogan:'成年人的微苦回甘',
    title:'亦苦亦甜的浪漫',
    quote:'研磨后的苦涩，萃取后的浓烈，都为了在这一刻唤醒沉睡的我。',
    color:'#7A5A38',
    bgDeep:'radial-gradient(circle at 60% 18%, #E8D4BC 0%, #D0B898 45%, #9C7A54 100%)',
    bgCard:'linear-gradient(160deg,#E0CCB8 0%,#D0B898 100%)',
    deco:'bean'
  }
};

/* ===== Init from URL ===== */
const params = new URLSearchParams(location.search);
let key = params.get('flavor');
if(!FLAVORS[key]) key = 'zhizi';
const F = FLAVORS[key];

document.body.style.background = F.bgDeep;
document.body.style.color = F.pageText || '#fff';
document.body.classList.add('flavor-' + key);
document.getElementById('chipName').textContent = F.name + ' · ' + F.en;
document.getElementById('chipDot').style.color = F.color;
document.getElementById('chipDot').style.background = F.color;
document.getElementById('themeLine').textContent = '「' + F.title + '」 ' + F.slogan;
document.getElementById('inspireLine').textContent = '灵感提示：' + F.quote;

/* ===== Deco generation ===== */
function buildDeco(type){
  const layer = document.getElementById('deco');
  const n = 14;
  for(let i=0;i<n;i++){
    const el = document.createElement('div');
    el.className = 'float';
    const size = 8 + Math.random()*22;
    el.style.left = Math.random()*100 + '%';
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.animationDuration = (8 + Math.random()*10) + 's';
    el.style.animationDelay = (Math.random()*8) + 's';
    if(type==='petal'){
      el.style.background = 'rgba(255,255,255,0.7)';
      el.style.borderRadius = '50% 0 50% 0';
    } else if(type==='moon'){
      el.style.background = 'radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%)';
      el.style.borderRadius = '50%';
    } else if(type==='sun'){
      el.style.background = 'linear-gradient(90deg, rgba(255,245,200,0.9), transparent)';
      el.style.borderRadius = '50%';
      el.style.height = (2+Math.random()*3)+'px';
    } else if(type==='berry'){
      el.style.background = 'rgba(120,80,150,0.55)';
      el.style.borderRadius = '50%';
    } else if(type==='leaf'){
      el.style.background = 'rgba(255,255,255,0.65)';
      el.style.borderRadius = '0 100% 0 100%';
    } else if(type==='bean'){
      el.style.background = 'rgba(120,80,50,0.5)';
      el.style.borderRadius = '50%';
    }
    layer.appendChild(el);
  }
}
buildDeco(F.deco);

/* ===== Count ===== */
function updateCount(){
  document.getElementById('charCount').textContent = document.getElementById('confessionText').value.length;
}

/* ===== Generate ===== */
function generate(){
  const txt = document.getElementById('confessionText').value.trim();
  if(!txt){ toast('⚠️ 写点什么吧，哪怕只是「我喜欢你」'); return; }
  const name = document.getElementById('signName').value.trim() || '匿名';
  const card = document.getElementById('card');
  card.style.background = F.bgCard;
  card.style.color = F.color;
  const lines = txt.split('\n').map(l=>'<span style="display:block;margin:5px 0">'+l+'</span>').join('');
  card.innerHTML = `
    <div class="badge">🍦</div>
    <div class="title">${F.title}</div>
    <div class="body">${lines}</div>
    <div class="sig">@${F.name} · ${name}</div>
  `;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('actionBar').style.display = 'flex';
  document.body.style.overflow='hidden';

  // 提交到后台（多人远程集中模式）。无后端时静默失败，不影响本地体验。
  try {
    fetch('api/confess' + (location.search || ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ flavor: key, name: name, text: txt })
    }).then(async function(r){
      if(r.ok){ toast('❤️ 已提交，待审核通过后上大屏'); }
      else {
        let msg = '提交失败，请稍后重试';
        try { const j = await r.json(); if(j && j.msg) msg = j.msg; } catch(e){}
        toast('⚠️ ' + msg);
      }
    }).catch(function(){ toast('⚠️ 网络异常，提交失败'); });
  } catch(e) {}
}

function closeR(e){
  if(e && e.target!==document.getElementById('overlay') && !e.target.classList.contains('close-btn')) return;
  exitLed();
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow='';
}
function back(){ window.location.href='confession-wall-step1.html' + (location.search||''); }

/* ===== LED ===== */
function ledMode(){
  document.getElementById('overlay').classList.add('led');
  const hint=document.createElement('div'); hint.className='led-hint'; hint.id='ledHint';
  hint.textContent='按 ESC 或点击空白处退出投屏';
  document.getElementById('overlay').appendChild(hint);
  document.addEventListener('keydown', escH);
}
function exitLed(){
  document.getElementById('overlay').classList.remove('led');
  const h=document.getElementById('ledHint'); if(h) h.remove();
  document.removeEventListener('keydown', escH);
}
function escH(e){ if(e.key==='Escape'){ closeR(); } }

/* ===== Save (print) ===== */
function saveCard(){
  toast('📸 正在打开保存窗口…');
  const card=document.getElementById('card');
  const st=getComputedStyle(card);
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>我的六味情书</title><style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#eee;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
    .c{width:450px;aspect-ratio:3/4;border-radius:20px;padding:46px 34px 40px;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:${st.background};color:${st.color};position:relative;overflow:hidden;}
    .brand{position:absolute;top:20px;left:24px;font-size:12px;letter-spacing:3px;opacity:.7;}
    .title{font-size:36px;font-weight:700;margin-bottom:22px;letter-spacing:2px;}
    .body{font-size:18px;line-height:2.1;opacity:.93;margin-bottom:26px;}
    .sig{font-size:14px;opacity:.78;margin-top:auto;}
    @media print{body{background:none}.c{box-shadow:none}}</style></head><body>
    <div class="c">${card.innerHTML}</div><script>window.onload=()=>window.print();<\/script></body></html>`);
  w.document.close();
}

/* ===== Toast ===== */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
